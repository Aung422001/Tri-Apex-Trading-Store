# Render Blueprint — Triapex Trading Group
# Deploy with: Render Dashboard → New → Blueprint → pick this repo.
# Docs: https://render.com/docs/blueprint-spec
#
#   https://triapextradinggroupmm.com       → triapex-web  (frontend)
#   https://www.triapextradinggroupmm.com   → triapex-web  (redirects to apex)
#   https://api.triapextradinggroupmm.com   → triapex-api  (backend)
#
# Everything here is on Render's FREE tier. Two consequences:
#   1. Free services sleep after 15 minutes idle; the next request takes
#      ~30s to wake them.
#   2. Render removes free Postgres databases after 30 days. Upgrade the
#      database before then, or you lose the data in it.

databases:
  - name: triapex-db
    databaseName: triapex
    user: triapex
    plan: free
    region: singapore

services:
  # ─────────────────────────────────────────────────────────
  # Backend API (Express + Prisma + Postgres)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: triapex-api
    runtime: node
    plan: free
    region: singapore
    branch: master

    domains:
      - api.triapextradinggroupmm.com

    # backend's build script runs `prisma generate` itself, from the backend
    # directory — running it from the repo root leaves the stub client in place
    # and tsc then fails on every generated Prisma type.
    # --prod=false is required: NODE_ENV=production below makes pnpm skip
    # devDependencies, and typescript, prisma and the type packages all live
    # there. prisma and ts-node are also needed at RUNTIME by start:prod.
    buildCommand: >-
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter backend build
    startCommand: pnpm --filter backend start:prod
    healthCheckPath: /health

    envVars:
      # Pin the toolchain. engines.node is ">=18", which Render resolved to
      # Node 26 — far newer than Next 14.1 / Prisma 5.22 were built against.
      # pnpm 8 matches lockfileVersion 6.0; pnpm 9+ rejects that lockfile
      # under --frozen-lockfile.
      - key: NODE_VERSION
        value: 22.17.1
      # @prisma/client's postinstall auto-runs generate and only looks in the
      # default schema locations; ours is at backend/src/prisma. Our own
      # backend postinstall/build runs generate explicitly with the right path.
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
      - key: PNPM_VERSION
        value: 8.15.0
      - key: NODE_ENV
        value: production
      # Wired automatically from the database above — never paste it by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: triapex-db
          property: connectionString
      - key: API_PREFIX
        value: /api/v1

      - key: API_URL
        value: https://api.triapextradinggroupmm.com
      - key: APP_URL
        value: https://triapextradinggroupmm.com
      # Both hostnames — a request from www is a different origin to the browser.
      - key: CORS_ORIGIN
        value: https://triapextradinggroupmm.com,https://www.triapextradinggroupmm.com

      # Chromium is ~150MB and won't run in 512MB of RAM, so the AI
      # price-comparison scraper is disabled in production.
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"

      # Generated once by Render and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true

      - key: EMAIL_FROM
        value: noreply@triapextradinggroupmm.com
      - key: ADMIN_EMAIL
        value: kht@triapextradinggroupmm.com

      # Secrets — set in the dashboard, never in this file.
      - key: ADMIN_DEFAULT_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ─────────────────────────────────────────────────────────
  # Frontend (Next.js)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: triapex-web
    runtime: node
    plan: free
    region: singapore
    branch: master

    domains:
      - triapextradinggroupmm.com
      - www.triapextradinggroupmm.com

    # --prod=false is required: NODE_ENV=production below makes pnpm skip
    # devDependencies, and typescript, prisma and the type packages all live
    # there. prisma and ts-node are also needed at RUNTIME by start:prod.
    buildCommand: >-
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter frontend build
    startCommand: pnpm --filter frontend start

    envVars:
      # Pin the toolchain. engines.node is ">=18", which Render resolved to
      # Node 26 — far newer than Next 14.1 / Prisma 5.22 were built against.
      # pnpm 8 matches lockfileVersion 6.0; pnpm 9+ rejects that lockfile
      # under --frozen-lockfile.
      - key: NODE_VERSION
        value: 22.17.1
      # @prisma/client's postinstall auto-runs generate and only looks in the
      # default schema locations; ours is at backend/src/prisma. Our own
      # backend postinstall/build runs generate explicitly with the right path.
      - key: PRISMA_SKIP_POSTINSTALL_GENERATE
        value: "true"
      - key: PNPM_VERSION
        value: 8.15.0
      - key: NODE_ENV
        value: production
      # NEXT_PUBLIC_* values are baked into the JS bundle at BUILD time, so
      # changing one needs "Clear build cache & deploy", not just a restart.
      # They also drive the CSP connect-src in next.config.js.
      - key: NEXT_PUBLIC_API_URL
        value: https://api.triapextradinggroupmm.com/api/v1
      - key: NEXT_PUBLIC_APP_URL
        value: https://triapextradinggroupmm.com
      - key: NEXT_PUBLIC_APP_NAME
        value: Triapex Trading Group
